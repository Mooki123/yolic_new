# V5 two-band: near band 256x48 + fovea 352x112 (1.08x MACs) (research/06 stage 1). Per-view BatchNorm re-run (research/06 addendum).
name: cityscapes_f_v5_pvbn
cache: ~/data/yolic_cache/cityscapes
layout: layouts/cityscapes.json
split: splits/cityscapes
object_classes: [0, 1, 2]   # People, Vehicle, Other: the paper's "All" excludes Road (bit 3)
primary_classes: [0, 1]     # People+Vehicle: the decision metric and the val' selection metric
model: {backbone: mnv2, head: fovea_gapfc, per_view_bn: true}
views: [near256x48, fov352x112]
input_size: 224
epochs: 150
milestones: [100, 125]
batch: 32
lr: 0.001
amp: true
normalize: true
flip: hflip
jitter: {brightness: 0.5, contrast: 0.5, saturation: 0.5, hue: 0.1}
