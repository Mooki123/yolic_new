# B8 = LR-ASPP-MobileNetV3-Small on 4-group pixel masks, max-pooled into cells.  Go/no-go arm H (C, compute-matched at 0.40x B1 MACs).
name: cityscapes_b8_lraspp_s
cache: ~/data/yolic_cache/cityscapes
layout: layouts/cityscapes.json
split: splits/cityscapes
object_classes: [0, 1, 2]   # People, Vehicle, Other: the paper's "All" excludes Road (bit 3)
primary_classes: [0, 1]     # People+Vehicle: the decision metric and the val' selection metric
model: {head: lraspp, size: small}
input_size: 224
epochs: 150
milestones: [100, 125]
batch: 32
lr: 0.001
amp: true
normalize: true
flip: hflip
jitter: {brightness: 0.5, contrast: 0.5, saturation: 0.5, hue: 0.1}
