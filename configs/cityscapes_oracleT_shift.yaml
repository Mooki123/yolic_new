# research/09 O_T: T's architecture (MIL-max s16, 168 input) retrained on the shift layout's labels.
name: cityscapes_oracleT_shift
cache: ~/data/yolic_cache/cityscapes
layout: layouts/cityscapes_shift.json
labels: cityscapes_shift
split: splits/cityscapes
object_classes: [0, 1, 2]   # People, Vehicle, Other: the paper's "All" excludes Road (bit 3)
primary_classes: [0, 1]     # People+Vehicle: the decision metric and the val' selection metric
model: {backbone: mnv2, head: mil, pool: max, stride: 16}
resize: 168
input_size: 224
epochs: 150
milestones: [100, 125]
batch: 32
lr: 0.001
amp: true
normalize: true
flip: hflip
jitter: {brightness: 0.5, contrast: 0.5, saturation: 0.5, hue: 0.1}
